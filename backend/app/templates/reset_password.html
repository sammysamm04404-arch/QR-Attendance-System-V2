<!DOCTYPE html>
<html>

    <head>

        <meta charset="UTF-8">

        <style>

            body{
                font-family:Arial,sans-serif;
                background:#f4f7fb;
                padding:40px;
            }

            .container{
                max-width:650px;
                margin:auto;
                background:white;
                border-radius:14px;
                padding:40px;
                box-shadow:0 10px 35px rgba(0,0,0,.08);
            }

            .header{
                background:#2563eb;
                color:white;
                padding:18px;
                border-radius:10px;
                text-align:center;
                font-size:24px;
                font-weight:bold;
            }

            .button{
                display:inline-block;
                margin-top:30px;
                padding:14px 26px;
                background:#2563eb;
                color:white !important;
                text-decoration:none;
                border-radius:8px;
                font-weight:bold;
            }

            .footer{
                margin-top:30px;
                color:#64748b;
                font-size:13px;
            }

        </style>

    </head>

    <body>

        <div class="container">

            <div class="header">

                QR Attendance System

            </div>

                <h2>Hello {{name}},</h2>

            <p>

                We received a request to reset your password.

            </p>

            <p>

                Click the button below.

            </p>

            <a href="{{reset_link}}" class="button">

                Reset Password

            </a>

            <p>

                This link expires in <strong>15 minutes</strong>.

            </p>

            <div class="footer">

                If you didn't request this password reset,
                you can safely ignore this email.

            </div>

        </div>

    </body>

</html>
